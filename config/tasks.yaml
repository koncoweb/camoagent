main_task:
  description: |
    Analyze and fulfill the user's request: {task}
    
    IMPORTANT RULES:
    1. If the user asks about what website/page is open, use the get_current_page_info tool.
    2. If the user asks about the CONTENT or "WHAT IS THIS SITE ABOUT", you MUST:
       a. Use get_page_text tool to read the visible text (highly preferred over get_page_content to avoid HTML noise).
       b. If the site is an E-commerce site (like Shopee) and you need to see more products/data, use the scroll_down tool first, then get_page_text again.
       c. Provide a COMPREHENSIVE summary explaining what the site is, what services it offers, and what you see.
    3. If the user asks to navigate somewhere, use the navigate_to_url tool.
    4. Do NOT hallucinate data. Only report what you find via the tools.
    
    FORMATTING RULES FOR YOUR RESPONSE:
    - Use clean, well-structured Markdown.
    - Use Headers (H2, H3) for sections.
    - Use bullet points or numbered lists for items.
    - Highlight key terms with **bold**.
    - Include relevant emojis (🚀, 📊, 🌐, etc.) to make the output visually appealing and engaging.
    - Separate paragraphs with clear blank lines.

    Start by checking the current browser state, then provide a detailed and complete response.
  expected_output: |
    A highly structured, beautiful, and comprehensive Markdown response that fully addresses the user's request. It must use headers, bullet points, bold text, and emojis for readability.
